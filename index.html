    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0f;
            color: #e8e8e8;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(136, 176, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        #ambient-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            z-index: 2;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(88, 166, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(88, 166, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridDrift 60s linear infinite;
        }

        @keyframes gridDrift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        #cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(138, 93, 255, 0.15) 0%, rgba(88, 166, 255, 0.08) 40%, transparent 70%);
            pointer-events: none;
            z-index: 3;
            mix-blend-mode: screen;
            transition: opacity 0.3s;
        }

        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
        }

        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 1.2s ease;
        }

        #boot-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .boot-text {
            color: #58a6ff;
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(88, 166, 255, 0.6);
            margin-bottom: 2rem;
        }

        .boot-progress {
            width: 300px;
            height: 2px;
            background: rgba(88, 166, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .boot-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #58a6ff, #8a5dff);
            width: 0%;
            animation: bootProgress 1s ease-out forwards;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.8);
        }

        @keyframes bootProgress {
            to { width: 100%; }
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .hero.visible {
            opacity: 1;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 9vw, 6rem);
            font-weight: 200;
            margin-bottom: 1.5rem;
            color: #f0f0f0;
            text-shadow: 0 0 40px rgba(136, 176, 255, 0.15);
            letter-spacing: -1px;
        }

        .hero .subtext {
            font-size: clamp(0.95rem, 2.2vw, 1.4rem);
            letter-spacing: 10px;
            color: #b8b8b8;
            font-weight: 200;
            text-transform: uppercase;
            position: relative;
            padding: 0 2rem;
        }

        .hero .subtext::before,
        .hero .subtext::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(88, 166, 255, 0.4));
        }

        .hero .subtext::before {
            left: 0;
        }

        .hero .subtext::after {
            right: 0;
            background: linear-gradient(270deg, transparent, rgba(88, 166, 255, 0.4));
        }

        .construction-banner {
            margin: 4rem auto;
            max-width: 750px;
            padding: 2.5rem 3rem;
            background: rgba(20, 20, 30, 0.7);
            border: 1px solid rgba(88, 166, 255, 0.25);
            border-radius: 6px;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s ease, transform 1.2s ease;
            animation: pulseGlow 5s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .construction-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(88, 166, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            to { left: 100%; }
        }

        .construction-banner.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(88, 166, 255, 0.15), inset 0 0 20px rgba(88, 166, 255, 0.05);
            }
            50% {
                box-shadow: 0 0 50px rgba(138, 93, 255, 0.35), inset 0 0 30px rgba(138, 93, 255, 0.1);
            }
        }

        .construction-banner p {
            margin: 0;
            font-size: clamp(1rem, 2.2vw, 1.2rem);
            color: #d8d8d8;
            letter-spacing: 1.5px;
            position: relative;
            z-index: 1;
        }

        .philosophical {
            text-align: center;
            margin: 6rem 0;
            padding: 0 2rem;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .philosophical.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .philosophical p {
            font-size: clamp(1.1rem, 2.3vw, 1.4rem);
            color: #9a9a9a;
            letter-spacing: 3px;
            font-weight: 200;
            line-height: 2;
        }

        .time-aware {
            text-align: center;
            margin: 3rem 0 2rem;
            padding: 0 2rem;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .time-aware.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .time-aware p {
            font-size: 0.95rem;
            color: #6a7a8a;
            letter-spacing: 2px;
            font-weight: 200;
            font-style: italic;
        }

        .contact {
            text-align: center;
            padding: 4rem 2rem 3rem;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .contact.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .contact a {
            display: block;
            color: #88b6ff;
            text-decoration: none;
            margin: 1rem 0;
            font-size: clamp(1rem, 2.2vw, 1.15rem);
            letter-spacing: 1.5px;
            transition: all 0.4s ease;
            position: relative;
            padding: 0.5rem;
        }

        .contact a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #88b6ff, transparent);
            transition: width 0.4s ease;
        }

        .contact a:hover {
            color: #b8d6ff;
            text-shadow: 0 0 20px rgba(136, 182, 255, 0.7);
            transform: translateY(-2px);
        }

        .contact a:hover::after {
            width: 100%;
        }

        #secret-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #58a6ff;
            font-size: 0.9rem;
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(88, 166, 255, 0.6);
            padding: 0.8rem 2rem;
            border: 1px solid rgba(88, 166, 255, 0.2);
            background: rgba(10, 10, 15, 0.9);
            border-radius: 4px;
        }

        #secret-message.show {
            opacity: 1;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='3.5' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            animation: noiseAnim 0.2s steps(10) infinite;
        }

        @keyframes noiseAnim {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -5%); }
            20% { transform: translate(-10%, 5%); }
            30% { transform: translate(5%, -10%); }
            40% { transform: translate(-5%, 15%); }
            50% { transform: translate(-10%, 5%); }
            60% { transform: translate(15%, 0); }
            70% { transform: translate(0, 10%); }
            80% { transform: translate(-15%, 0); }
            90% { transform: translate(10%, 5%); }
        }

        @media (max-width: 768px) {
            .hero .subtext {
                letter-spacing: 5px;
            }
            .hero .subtext::before,
            .hero .subtext::after {
                width: 30px;
            }
            .construction-banner {
                padding: 2rem 1.5rem;
            }
            #cursor-glow {
                width: 200px;
                height: 200px;
            }
        }

        /* Smooth performance hint */
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="boot-screen">
        <div class="boot-text">INITIALIZING SYSTEM...</div>
        <div class="boot-progress">
            <div class="boot-progress-bar"></div>
        </div>
    </div>

    <canvas id="particles"></canvas>
    <div id="ambient-grid"></div>
    <div id="cursor-glow"></div>
    <div class="noise-overlay"></div>

    <main class="content">
        <section class="hero">
            <h1>Hey, I'm Aryan Neupane</h1>
            <p class="subtext">Observing | Absorbing | Outgrowing</p>
        </section>

        <div class="container">
            <div class="construction-banner">
                <p>⚠️ Portfolio still under construction — come back later for the magic.</p>
            </div>

            <article class="philosophical">
                <p>Still building. Still becoming.</p>
            </article>

            <div class="time-aware">
                <p id="time-message"></p>
            </div>

            <footer class="contact">
                <a href="mailto:contact@aryanneupane.com.np" aria-label="Email Aryan Neupane">contact@aryanneupane.com.np</a>
                <a href="mailto:email@aryanneupane.com" aria-label="Alternative email for Aryan Neupane">email@aryanneupane.com</a>
            </footer>
        </div>

    <div id="secret-message" role="status" aria-live="polite"></div>

    <script>
        // Performance optimization
        const isReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        // Boot screen with progress bar
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('boot-screen').classList.add('fade-out');
                setTimeout(() => {
                    document.querySelector('.hero').classList.add('visible');
                }, 200);
            }, 1200);
        });

        // Enhanced particle system with depth
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 120;
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.depth = Math.random();
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
                this.twinklePhase = Math.random() * Math.PI * 2;
                this.hue = 200 + Math.random() * 60;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Boundary wrapping
                if (this.x < -10) this.x = canvas.width + 10;
                if (this.x > canvas.width + 10) this.x = -10;
                if (this.y < -10) this.y = canvas.height + 10;
                if (this.y > canvas.height + 10) this.y = -10;

                // Twinkle effect
                this.twinklePhase += this.twinkleSpeed;
                this.currentOpacity = this.opacity * (0.5 + 0.5 * Math.sin(this.twinklePhase));
            }

            draw() {
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
                gradient.addColorStop(0, `hsla(${this.hue}, 70%, 70%, ${this.currentOpacity})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 70%, 70%, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Connection lines between close particles
        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        const opacity = (1 - distance / 120) * 0.15;
                        ctx.strokeStyle = `rgba(136, 176, 255, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!isReducedMotion) {
                drawConnections();
            }
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animateParticles);
        }

        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Enhanced cursor glow with trail effect
        const cursorGlow = document.getElementById('cursor-glow');
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
        });

        function updateCursorGlow() {
            // Smooth following with easing
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            
            cursorGlow.style.left = (currentX - 150) + 'px';
            cursorGlow.style.top = (currentY - 150) + 'px';
            requestAnimationFrame(updateCursorGlow);
        }

        updateCursorGlow();

        // Enhanced parallax on mouse movement
        document.addEventListener('mousemove', (e) => {
            if (isReducedMotion) return;
            
            const moveX = (e.clientX - window.innerWidth / 2) * 0.015;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.015;
            
            particles.forEach(particle => {
                const depth = particle.depth;
                particle.x += moveX * depth;
                particle.y += moveY * depth;
            });
        });

        // Dynamic background gradient shift
        let hue = 220;
        let saturation = 20;
        setInterval(() => {
            if (isReducedMotion) return;
            
            hue = (hue + 0.05) % 360;
            saturation = 20 + Math.sin(Date.now() / 10000) * 5;
            document.body.style.background = `linear-gradient(135deg, 
                hsl(${hue}, ${saturation}%, 4%) 0%, 
                hsl(${(hue + 40) % 360}, ${saturation + 5}%, 6%) 100%)`;
        }, 100);

        // Scroll-based reveal with stagger
        const observerOptions = {
            threshold: 0.15,
            rootMargin: '0px 0px -80px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, index * 100);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.construction-banner, .philosophical, .time-aware, .contact').forEach(el => {
            observer.observe(el);
        });

        // Time-aware message
        function setTimeMessage() {
            const hour = new Date().getHours();
            const messageEl = document.getElementById('time-message');
            
            if (hour >= 22 || hour < 6) {
                messageEl.textContent = "The system is quieter now.";
            } else {
                messageEl.textContent = "Signals are louder during daylight.";
            }
        }

        setTimeMessage();

        // Secret interaction with animation
        let secretTimeout;
        document.addEventListener('keypress', (e) => {
            if (e.key === '.' || e.key === '~') {
                const msg = document.getElementById('secret-message');
                msg.textContent = 'System state: evolving';
                msg.classList.add('show');
                
                clearTimeout(secretTimeout);
                secretTimeout = setTimeout(() => {
                    msg.classList.remove('show');
                }, 3500);
            }
        });

        // Easter egg: konami code
        const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        let konamiIndex = 0;

        document.addEventListener('keydown', (e) => {
            if (e.key === konamiCode[konamiIndex]) {
                konamiIndex++;
                if (konamiIndex === konamiCode.length) {
                    const msg = document.getElementById('secret-message');
                    msg.textContent = '⚡ Consciousness unlocked ⚡';
                    msg.classList.add('show');
                    
                    // Add extra particle burst
                    for (let i = 0; i < 50; i++) {
                        particles.push(new Particle());
                    }
                    
                    setTimeout(() => {
                        msg.classList.remove('show');
                        particles.splice(particleCount);
                    }, 4000);
                    
                    konamiIndex = 0;
                }
            } else {
                konamiIndex = 0;
            }
        });

        // Accessibility: respect prefers-reduced-motion
        if (isReducedMotion) {
            document.querySelectorAll('*').forEach(el => {
                el.style.animation = 'none';
                el.style.transition = 'none';
            });
        }
    </script>
</body>
